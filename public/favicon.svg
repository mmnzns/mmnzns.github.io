<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Miguel Monzones">
  <!--
    Ink tile, paper monogram, coral rule beneath it: the same accent bar that
    marks a category throughout the site. Colours are the ink, paper and coral
    tokens from src/styles/global.css.

    Weights and sizes are tuned for 16px, where a lighter M turns to mush and a
    thinner rule disappears into the tile. Checked by rasterising, not by eye at
    full size.
  -->
  <rect width="64" height="64" rx="14" fill="#1F1C19" />
  <text
    x="32"
    y="28"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-1"
    fill="#FBF9F6"
  >M</text>
  <rect x="19" y="47" width="26" height="6" rx="3" fill="#F2603F" />
</svg>
